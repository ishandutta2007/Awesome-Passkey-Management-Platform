<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a16" />
      <stop offset="50%" stop-color="#120c24" />
      <stop offset="100%" stop-color="#1a0b36" />
    </linearGradient>

    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="50%" stop-color="#FF0080" />
      <stop offset="100%" stop-color="#00DFD8" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.6" />
    </linearGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes float {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes pulse-glow {
        0% { opacity: 0.4; transform: scale(0.98); }
        50% { opacity: 0.8; transform: scale(1.03); }
        100% { opacity: 0.4; transform: scale(0.98); }
      }
      @keyframes wave-move {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      .animated-shield {
        animation: float 6s ease-in-out infinite;
        transform-origin: center;
      }
      .glowing-bg {
        animation: pulse-glow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .tech-line {
        stroke-dasharray: 20, 10;
        animation: wave-move 12s linear infinite;
      }
      .title-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
      }
      .sub-text {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <circle cx="200" cy="100" r="180" fill="#7928CA" opacity="0.15" filter="url(#glow-pink)" class="glowing-bg" />
  <circle cx="1000" cy="300" r="220" fill="#00c6ff" opacity="0.15" filter="url(#glow-cyan)" class="glowing-bg" />

  <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
  <path d="M 300,0 L 300,400 M 600,0 L 600,400 M 900,0 L 900,400" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />

  <path d="M 50,340 Q 300,280 600,340 T 1150,320" fill="none" stroke="url(#cyan-violet)" stroke-width="2" stroke-opacity="0.6" class="tech-line" />
  <path d="M 50,360 Q 350,310 700,360 T 1150,340" fill="none" stroke="#9b51e0" stroke-width="1.5" stroke-opacity="0.4" class="tech-line" />

  <g class="animated-shield" transform="translate(160, 200)">
    <path d="M 0,-90 L 70,-50 L 70,30 C 70,80 0,110 0,110 C 0,110 -70,80 -70,30 L -70,-50 Z" fill="url(#shield-grad)" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cyan)" />
    <circle cx="0" cy="-15" r="22" fill="none" stroke="#ffffff" stroke-width="6" />
    <circle cx="0" cy="-15" r="8" fill="#ffffff" />
    <path d="M 0,7 L 0,55 M 0,28 L 16,28 M 0,42 L 12,42" stroke="#ffffff" stroke-width="6" stroke-linecap="round" />
  </g>

  <g transform="translate(300, 0)">
    <rect x="0" y="70" width="280" height="32" rx="16" fill="#1f1a3a" stroke="#00f2fe" stroke-opacity="0.5" stroke-width="1.5" />
    <text x="140" y="91" text-anchor="middle" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">
      🔐 FIDO2 • WEBAUTHN • PASSKEYS
    </text>

    <text x="0" y="165" fill="#ffffff" class="title-text" font-size="44" letter-spacing="-0.5">
      Awesome Passkey Platform
    </text>
    <text x="0" y="215" fill="url(#text-grad)" class="title-text" font-size="36">
      Ecosystem & Infrastructure
    </text>

    <text x="0" y="265" fill="#a0a5c0" class="sub-text" font-size="18">
      Curated SaaS Platforms, Self-Hosted Servers & Enterprise Identity Solutions
    </text>

    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#161b2e" stroke="#30363d" />
      <text x="65" y="19" text-anchor="middle" fill="#7928CA" class="title-text" font-size="13">⚡ 22+ SaaS</text>

      <rect x="145" y="0" width="160" height="28" rx="6" fill="#161b2e" stroke="#30363d" />
      <text x="225" y="19" text-anchor="middle" fill="#00c6ff" class="title-text" font-size="13">⭐ 35+ Open-Source</text>

      <rect x="320" y="0" width="180" height="28" rx="6" fill="#161b2e" stroke="#30363d" />
      <text x="410" y="19" text-anchor="middle" fill="#FF0080" class="title-text" font-size="13">🛡️ Passwordless MFA</text>
    </g>
  </g>
</svg>