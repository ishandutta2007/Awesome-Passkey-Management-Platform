<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19" />
      <stop offset="50%" stop-color="#14182d" />
      <stop offset="100%" stop-color="#1c1033" />
    </linearGradient>

    <!-- Accent Gradient Cyan-Blue -->
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Title Gradient Purple-Pink-Cyan -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Geometric Grid Background Lines -->
  <path d="M 0,80 L 1200,80 M 0,160 L 1200,160 M 0,240 L 1200,240 M 0,320 L 1200,320" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />
  <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" />

  <!-- Decorative Background Glowing Circles -->
  <circle cx="160" cy="200" r="140" fill="url(#ringGrad)" />
  <circle cx="1080" cy="100" r="160" fill="#ec4899" opacity="0.08" />

  <!-- Left Side Passkey Shield & Key Icon -->
  <g transform="translate(160, 200)">
    <!-- Outer Decorative Orbit -->
    <circle cx="0" cy="0" r="95" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="8 6" stroke-opacity="0.6" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="15 10" stroke-opacity="0.4" />

    <!-- Main Shield -->
    <path d="M 0,-75 L 60,-40 L 60,25 C 60,65 0,90 0,90 C 0,90 -60,65 -60,25 L -60,-40 Z" fill="url(#shieldGrad)" stroke="#00f2fe" stroke-width="2.5" />

    <!-- Inner Key Symbol -->
    <circle cx="0" cy="-12" r="18" fill="none" stroke="#ffffff" stroke-width="5" />
    <circle cx="0" cy="-12" r="6" fill="#ffffff" />
    <path d="M 0,6 L 0,45 M 0,22 L 12,22 M 0,34 L 10,34" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Right Side Main Header & Content -->
  <g transform="translate(320, 0)">
    <!-- Top Pill Badge -->
    <rect x="0" y="65" width="290" height="34" rx="17" fill="#1e1b4b" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.7" />
    <text x="145" y="87" text-anchor="middle" fill="#00f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      🔐 FIDO2 • WEBAUTHN • PASSKEYS
    </text>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      Awesome Passkey Platform
    </text>
    <text x="0" y="205" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">
      Ecosystem &amp; Infrastructure
    </text>

    <!-- Subtitle -->
    <text x="0" y="255" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">
      Curated SaaS Platforms, Self-Hosted Servers &amp; Developer Auth SDKs
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 290)">
      <rect x="0" y="0" width="135" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="67" y="21" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⚡ 22+ SaaS</text>

      <rect x="150" y="0" width="170" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="235" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">⭐ 35+ Open-Source</text>

      <rect x="335" y="0" width="190" height="32" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
      <text x="430" y="21" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">🛡️ Passwordless MFA</text>
    </g>
  </g>
</svg>